bio: |
  I'm a PhD student in Mathematics at Univesity of Brasília under the 
  supervision of [Pavel Zalesskii](https://mat.unb.br/~pz/index.html). I am BSc (2023) and MSc (2026) in 
  Mathematics by Universiy of Brasília. My master's advisor was [Theo
  Zapata](https://mat.unb.br/zapata/). I work in group theory and my main research interests lies
  in profinite groups, especially combinatorial theory for profinite 
  and pro-p groups and p-adic analytic groups.

